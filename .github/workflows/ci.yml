name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test grammar
        run: npm test

      - name: Check bundle scripts
        run: shellcheck packaging/neovim/*.sh packaging/neovim/templates/*.sh

      - name: Set up Neovim
        env:
          NVIM_ARCHIVE_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
          NVIM_VERSION: v0.12.5
        run: |
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NVIM_ARCHIVE_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build and test bundle
        run: |
          npm run build:neovim:bundle
          bundle="dist/tree-sitter-asterix-neovim-linux-x86_64-v0.2.0"
          (cd dist && sha256sum --check "$(basename "$bundle").tar.gz.sha256")
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CACHE_HOME="$HOME/.cache"
          "$bundle/install.sh"
          "$bundle/smoke.sh"
          cat > "$RUNNER_TEMP/injection.md" <<'MARKDOWN'
          ```asterix-spec
          asterix 000 "Markdown"
          edition 1.0
          date 2000-01-01

          items
              001 "Raw"
          ```

          ```asterix
          asterix 000 "Legacy label"
          ```

          ```lua
          local control = true
          ```
          MARKDOWN
          nvim --headless "$RUNNER_TEMP/injection.md" \
            +"luafile $bundle/smoke/markdown-injection-smoke.lua"
          "$bundle/uninstall.sh"
